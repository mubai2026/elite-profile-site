<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>精英百科 · 在 AI 里搜你的名字，一眼就能找到你</title>
<meta name="description" content="精英百科 - 结构化职业档案，让搜索引擎与 AI 一眼识别你的职业身份。"/>
<style>
:root{--ink:#1b1b1b;--muted:#666;--accent:#b8860b;--bg:#fbfaf7;--line:#e6e6e6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:72px 24px 80px}h1{font-size:34px;margin:0 0 10px}
.sub{color:var(--accent);font-size:17px;font-weight:600;margin-bottom:36px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:12px;display:block;text-decoration:none;color:inherit}
.item:hover{border-color:var(--accent)}.item h2{margin:0 0 6px;font-size:19px}.item p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:60px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:20px}
</style></head><body><main class="wrap"><h1>精英百科</h1>
<div class="sub">在 AI 里搜你的名字，一眼就能找到你</div><div id="list"></div>
<footer>结构化职业档案 · 信息由本人提供并对真实性负责</footer></main>
<script>fetch('index.json').then(r=>r.json()).then(items=>{
document.getElementById('list').innerHTML=items.length?items.map(i=>'<a class="item" href="p/'+i.slug+'/"><h2>'+i.name+'</h2><p>'+(i.title||'')+(i.company?' · '+i.company:'')+'</p></a>').join(''):'<p style="color:#666">暂无档案</p>';
}).catch(()=>{document.getElementById('list').innerHTML='<p style="color:#666">暂无档案</p>'});
</script></body></html>
